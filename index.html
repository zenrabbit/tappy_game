<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#202223" />
  <title>Touch Green</title>

  <style>
    :root {
      --bg: #202223;
      --panel: #2b2d2e;
      --tile: #616364;
      --green: #55c96b;
      --red: #df2b20;
      --text: #f5f5f5;
      --muted: #bfc4c6;
      --border: #454849;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .app { width: min(720px, 100%); }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stats span { white-space: nowrap; }

    #startBtn {
      min-height: 46px;
      padding: 11px 20px;
      border: 1px solid #777;
      border-radius: 10px;
      background: #3a3d3e;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    #startBtn:active { transform: scale(0.98); }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      background: #27292a;
      padding: 7px;
      border-radius: 14px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 10px;
      background: var(--tile);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16);
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 60ms linear, transform 50ms ease;
    }

    .cell:active { transform: scale(0.97); }
    .cell.green { background: var(--green); }
    .cell.red { background: var(--red); }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
      font-weight: 700;
      text-align: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: inline-block;
    }

    .swatch.green { background: var(--green); }
    .swatch.red { background: var(--red); }

    #status {
      min-height: 24px;
      margin-top: 12px;
      color: var(--muted);
      text-align: center;
    }

    .results {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .results.show { display: block; }

    .results h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .result {
      padding: 13px 8px;
      border-radius: 10px;
      background: #363839;
      text-align: center;
      min-width: 0;
    }

    .result-value {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .result-label {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .result:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 420px) {
      #startBtn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell, #startBtn { transition: none; }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="topbar">
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Time: <strong id="time">30.0</strong>s</span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <button id="startBtn" type="button">Start</button>
    </div>

    <div id="board" class="board" aria-label="3 by 3 reaction game">
      <button class="cell" type="button" data-index="0" aria-label="game tile 1"></button>
      <button class="cell" type="button" data-index="1" aria-label="game tile 2"></button>
      <button class="cell" type="button" data-index="2" aria-label="game tile 3"></button>
      <button class="cell" type="button" data-index="3" aria-label="game tile 4"></button>
      <button class="cell" type="button" data-index="4" aria-label="game tile 5"></button>
      <button class="cell" type="button" data-index="5" aria-label="game tile 6"></button>
      <button class="cell" type="button" data-index="6" aria-label="game tile 7"></button>
      <button class="cell" type="button" data-index="7" aria-label="game tile 8"></button>
      <button class="cell" type="button" data-index="8" aria-label="game tile 9"></button>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="swatch green"></span>
        Green: +1
      </div>
      <div class="legend-item">
        <span class="swatch red"></span>
        Red: −1
      </div>
    </div>

    <div id="status" aria-live="polite">
      Press Start. Tap green wherever it appears.
    </div>

    <section id="results" class="results" aria-live="polite">
      <h2>Round over</h2>

      <div class="result-grid">
        <div class="result">
          <div id="resultGreenTaps" class="result-value">0</div>
          <div class="result-label">Green taps</div>
        </div>

        <div class="result">
          <div id="resultRedTaps" class="result-value">0</div>
          <div class="result-label">Red taps</div>
        </div>

        <div class="result">
          <div id="resultScore" class="result-value">0</div>
          <div class="result-label">Score</div>
        </div>

        <div class="result">
          <div id="resultBest" class="result-value">0</div>
          <div class="result-label">Best score</div>
        </div>

        <div class="result">
          <div id="resultReaction" class="result-value">—</div>
          <div class="result-label">Average reaction time</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const ROUND_MS = 30000;

      const startBtn = document.getElementById("startBtn");
      const board = document.getElementById("board");
      const cells = Array.from(board.querySelectorAll(".cell"));
      const scoreEl = document.getElementById("score");
      const timeEl = document.getElementById("time");
      const bestEl = document.getElementById("best");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");

      const resultGreenTaps = document.getElementById("resultGreenTaps");
      const resultRedTaps = document.getElementById("resultRedTaps");
      const resultScore = document.getElementById("resultScore");
      const resultBest = document.getElementById("resultBest");
      const resultReaction = document.getElementById("resultReaction");

      let running = false;
      let state = "off";
      let activeIndex = -1;
      let previousIndex = -1;

      let score = 0;
      let greenTaps = 0;
      let redTaps = 0;

      let best = 0;
      try {
        best = Number(localStorage.getItem("touchGreenMovingBest") || 0);
        if (!Number.isFinite(best)) best = 0;
      } catch (_) {
        best = 0;
      }
      bestEl.textContent = String(best);

      let reactionTimes = [];
      let greenShownAt = null;
      let roundStartedAt = 0;

      let animationFrame = null;
      let nextTimer = null;

      function nowMs() {
        return performance.now();
      }

      function clearCells() {
        for (const cell of cells) {
          cell.classList.remove("green", "red");
          cell.setAttribute("aria-label", "game tile");
        }
      }

      function randomNewIndex() {
        let next;
        do {
          next = Math.floor(Math.random() * cells.length);
        } while (next === previousIndex);
        return next;
      }

      function setState(nextState) {
        clearCells();
        state = nextState;

        if (nextState === "off") {
          activeIndex = -1;
          greenShownAt = null;
          return;
        }

        activeIndex = randomNewIndex();
        previousIndex = activeIndex;

        if (nextState === "green") {
          cells[activeIndex].classList.add("green");
          cells[activeIndex].setAttribute("aria-label", "green target");
          greenShownAt = nowMs();
        } else if (nextState === "red") {
          cells[activeIndex].classList.add("red");
          cells[activeIndex].setAttribute("aria-label", "red trap");
          greenShownAt = null;
        }
      }

      function updateScore() {
        scoreEl.textContent = String(score);

        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          try {
            localStorage.setItem("touchGreenMovingBest", String(best));
          } catch (_) {}
        }
      }

      function averageReactionTime() {
        if (reactionTimes.length === 0) return null;

        let total = 0;
        for (const time of reactionTimes) total += time;

        return total / reactionTimes.length;
      }

      function scheduleNext() {
        clearTimeout(nextTimer);

        if (!running) return;

        setState("off");

        const gapMs = 250 + Math.random() * 550;

        nextTimer = setTimeout(() => {
          if (!running) return;

          const showRed = Math.random() < 0.30;

          if (showRed) {
            setState("red");

            // Red stays visible for 1–2 seconds, then disappears automatically.
            const redDurationMs = 1000 + Math.random() * 1000;

            nextTimer = setTimeout(() => {
              if (running) scheduleNext();
            }, redDurationMs);
          } else {
            // Green stays visible until successfully tapped.
            setState("green");
          }
        }, gapMs);
      }

      function endRound() {
        if (!running) return;

        running = false;
        clearTimeout(nextTimer);

        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
        }

        setState("off");

        timeEl.textContent = "0.0";
        startBtn.textContent = "Play again";

        const avg = averageReactionTime();

        resultGreenTaps.textContent = String(greenTaps);
        resultRedTaps.textContent = String(redTaps);
        resultScore.textContent = String(score);
        resultBest.textContent = String(best);
        resultReaction.textContent = avg === null ? "—" : `${avg.toFixed(1)} ms`;

        resultsEl.classList.add("show");

        statusEl.textContent = avg === null
          ? `Round over. Score: ${score}.`
          : `Round over. Score: ${score}. Average reaction time: ${avg.toFixed(1)} ms.`;
      }

      function updateTimer(timestamp) {
        if (!running) return;

        const elapsed = timestamp - roundStartedAt;
        const remaining = Math.max(0, ROUND_MS - elapsed);

        timeEl.textContent = (remaining / 1000).toFixed(1);

        if (remaining <= 0) {
          endRound();
          return;
        }

        animationFrame = requestAnimationFrame(updateTimer);
      }

      function startRound() {
        clearTimeout(nextTimer);

        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
        }

        running = true;
        state = "off";
        activeIndex = -1;
        previousIndex = -1;

        score = 0;
        greenTaps = 0;
        redTaps = 0;
        reactionTimes = [];
        greenShownAt = null;

        scoreEl.textContent = "0";
        timeEl.textContent = "30.0";

        resultsEl.classList.remove("show");
        startBtn.textContent = "Restart";
        statusEl.textContent = "Tap green wherever it appears. Red costs 1 point.";

        clearCells();

        roundStartedAt = nowMs();

        scheduleNext();
        animationFrame = requestAnimationFrame(updateTimer);
      }

      function handleTileTap(event) {
        if (!running) return;

        const tile = event.target.closest(".cell");
        if (!tile) return;

        const tappedIndex = Number(tile.dataset.index);

        if (tappedIndex !== activeIndex) return;

        if (state === "green" && greenShownAt !== null) {
          const reactionMs = nowMs() - greenShownAt;

          reactionTimes.push(reactionMs);
          greenTaps += 1;
          score += 1;

          updateScore();
          statusEl.textContent = "Green: +1";
          scheduleNext();
        } else if (state === "red") {
          redTaps += 1;
          score -= 1;

          updateScore();
          statusEl.textContent = "Red: −1 point";
        }
      }

      startBtn.addEventListener("click", startRound);
      board.addEventListener("click", handleTileTap);
    })();
  </script>
</body>
</html>
